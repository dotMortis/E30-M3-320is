; Receiver (ESP32 #1): always-on, USB-powered. Runs an ESP-NOW receiver and
; forwards validated press/release events to the PC over native USB CDC
; serial. See ../PLAN.md.
;
; Flash with (run from hardware/voice-remote/, or `cd receiver` first):
;   pio run -d receiver -t upload -t monitor
;
; Board id targets the official ESP32-C3-DevKitM-1 pin/flash-size definition,
; which matches the "ESP32-C3 SuperMini" clone boards closely enough (same
; SoC/module, 4MB flash) for Arduino/PlatformIO purposes - only the physical
; PCB and pin silkscreen differ.
;
; platform version pinned to what's confirmed to compile (see ../PLAN.md
; "Known limitations" for the arduino-esp32 2.x/ESP-IDF-4.x API quirks this
; specific version has vs. newer 3.x/IDF-5.x cores).

[env:receiver]
platform = espressif32@7.0.1
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -I ../shared
    -I ..
