; Remote (ESP32 #2): battery-powered, one momentary switch on GPIO3, deep
; sleep by default. See ../PLAN.md.
;
; Flash with (run from hardware/voice-remote/, or `cd remote` first):
;   pio run -d remote -t upload -t monitor
; (press the button once after upload so it wakes up and prints its MAC/logs -
; it does nothing observable while idle/asleep, which is the whole point.)
;
; platform version pinned to what's confirmed to compile (see ../PLAN.md
; "Known limitations" for the arduino-esp32 2.x/ESP-IDF-4.x API quirks this
; specific version has vs. newer 3.x/IDF-5.x cores).

[env:remote]
platform = espressif32@7.0.1
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -I ../shared
    -I ..
